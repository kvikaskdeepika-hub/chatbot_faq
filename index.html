<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <title>Student FAQ Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="chat-container">

    <h1>🤖 Student FAQ Chatbot</h1>

    <p>Ask questions about college facilities and services</p>

    <hr>

    <!-- Previous messages -->

    {% if question %}

        <div class="message user-message">
            👤 {{ question }}
        </div>

    {% endif %}


    {% if answer %}

        <div class="message bot-message">
            🤖 {{ answer }}
        </div>

    {% endif %}


    <!-- Input form -->

    <form method="POST" action="/chat">

        <input
            type="text"
            name="question"
            placeholder="Type your question..."
            required
        >

        <button type="submit">
            Send
        </button>

    </form>


    <br>


    <!-- Suggestions -->

    <button
        type="button"
        onclick="document.querySelector('input[name=question]').value='What are the college timings?'"
    >
        College timings
    </button>


    <button
        type="button"
        onclick="document.querySelector('input[name=question]').value='Is there a library in the college?'"
    >
        Library
    </button>


    <button
        type="button"
        onclick="document.querySelector('input[name=question]').value='Are scholarships available?'"
    >
        Scholarships
    </button>


    <button
        type="button"
        onclick="document.querySelector('input[name=question]').value='Does the college provide hostel facilities?'"
    >
        Hostel
    </button>


    <p>
        Powered by NLP • TF-IDF • Cosine Similarity
    </p>

</div>

</body>
</html>
